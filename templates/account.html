{% extends "layout.html" %}
{% block content %}

<style>
    .saved-plants-section .row {
    justify-content: center;
    }
    .account-info {
        max-width: 250px;
        text-align: left;
        opacity: 0.8;
        margin-bottom: 30px;
    }

    .account-info h3 {
        font-size: 22px;
        margin-bottom: 5px;
    }

    .account-info p {
        font-size: 14px;
        color: #666;
    }

 .saved-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 25px;
        padding: 20px;
    }

    /* Karten Styling */
    .saved-grid .card {
        border-radius: 12px;
        overflow: hidden;
        transition: transform 0.15s ease;
    }

    .saved-grid .card:hover {
        transform: scale(1.03);
    }

    .saved-grid img {
        width: 100%;
        height: auto;
    }

</style>

<div class="container mt-4">

    <!-- LEFT CORNER ACCOUNT INFO -->
    <div class="account-info">
        <h3>{{ current_user.username }}</h3>
        <p>{{ current_user.email }}</p>
    </div>

    <div class="saved-plants-section text-center">
        <h3 class="mb-4">Saved Plants</h3>

        {% if current_user.saved %}
            <div class="saved-grid">

                {% for plant in current_user.saved %}
                    <a href="{{ url_for('plant_detail', plant_id=plant.id) }}"
                       class="text-decoration-none text-dark">

                        <div class="card plant-card">
                            <img src="{{ url_for('static', filename='images/' + plant.image_file) }}"
                                 alt="{{ plant.name }}">

                            <div class="card-body">
                                <h5 class="card-title">{{ plant.name }}</h5>
                            </div>
                        </div>

                    </a>
                {% endfor %}

            </div>
        {% else %}
            <p class="text-muted">You have no saved plants yet.</p>
        {% endif %}
    </div>

</div>

{% endblock %}
