{% extends "layout.html" %}
{% block content %}
<div class="container mt-4">

    <h2 class="text-center">Search results for "{{query}}"</h2>

    {%if plants%}
     <div class="row mt-4 justify-content-center">


        {% for plant in plants %}
        <div class="col-md-3">

            <a href="{{ url_for('plant_detail', plant_id=plant.id)}}" class="text-decoration-none text-dark">

            <div class="card plant-card">
                <img src="{{ url_for('static', filename='images/' + plant.image_file) }}"
                     alt="{{ plant.name }}">

                <div class="card-body">
                    <h5 class="card-title">{{ plant.name }}</h5>
                    <p class="card-text muted"> {{ plant.description[:120] }}</p>
                </div>
            </div>
            </a>
        </div>
        {% endfor %}
        </div>
      {% else %}
        <p>No plants found matching your search.</p>
      {% endif %}
</div>
{% endblock %}
